name: Fork Windows portable release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.repository != 'ok-oldking/ok-wuthering-waves'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            pyproject.toml

      - name: Install runtime and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Run tests in separate processes
        timeout-minutes: 30
        shell: pwsh
        run: |
          Get-ChildItem -Path '.\tests\*.py' | Sort-Object Name | ForEach-Object {
            Write-Host "Running tests in $($_.FullName)"
            python -u run_test.py $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Tests failed in $($_.FullName)"
            }
          }

      - name: Build portable package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build_portable.py --version "$env:RELEASE_TAG"

      - name: Verify packaged executable and runtime resources
        shell: pwsh
        run: |
          $exe = Resolve-Path '.\dist\BetterWW\BetterWW.exe'
          $process = Start-Process -FilePath $exe.Path -ArgumentList '--self-test' -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw 'Packaged executable self-test failed.'
          }
          $report = Get-Content '.\dist\BetterWW\smoke-test.json' -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.qt_initialized -or -not $report.imports -or -not $report.resources) {
            throw 'Packaged executable did not produce a valid smoke-test report.'
          }

      - name: Publish draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/BetterWW-${{ github.ref_name }}-windows-x64.zip
            dist/BetterWW-${{ github.ref_name }}-windows-x64.sha256
